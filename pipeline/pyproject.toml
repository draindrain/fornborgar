[project]
name = "fornborg-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Fornborg Explorer: fetches, clips and encodes the elevation grids and manifest consumed by the static app."
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "pyproj>=3.5",
    "numpy>=1.24",
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fornborg-pipeline = "fornborg_pipeline.build:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fornborg_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
