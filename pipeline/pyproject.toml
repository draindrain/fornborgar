[project]
name = "fornborg-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Fornborg Explorer: fetches, clips and encodes the elevation grids and manifest consumed by the static app."
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "pyproj>=3.5",
    "numpy>=1.24",
    "scipy>=1.11",
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# The object-store sync (fornborg_pipeline.upload). Optional on purpose: every
# other step runs without it, and a machine that only builds bundles should not
# need an AWS SDK.
upload = ["boto3>=1.34"]

[project.scripts]
fornborg-pipeline = "fornborg_pipeline.build:cli"
fornborg-build-site = "fornborg_pipeline.build_site:cli"
fornborg-registry = "fornborg_pipeline.registry:cli"
fornborg-upload = "fornborg_pipeline.upload:cli"
fornborg-batch = "fornborg_pipeline.batch:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fornborg_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
